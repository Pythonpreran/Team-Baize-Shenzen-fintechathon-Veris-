# PROVEN — coverage mechanisms, defined by STRUCTURE rather than by name.
#
# WHY THIS FILE EXISTS
# -------------------
# The exact (carrier, clause_ref) map in account.py is precise and does not scale: a
# human must read each wording before the engine can say anything about it. Three
# carriers took a week. Forty would take a year.
#
# The reason a map is needed at all is that carriers give the same mechanism different
# names. Proportionate reduction for under-insurance is called:
#     "Average"            Chubb Select+ cl 4.2
#     "UNDERINSURANCE"     MSIG SUMO GC12
#     "Average"            Liberty SMECare GC4        (value basis, no threshold)
#     "Average Relief"     Liberty SMECare p.7/p.26   (reinstatement basis, 85%)
# A clause-number map cannot find these. Neither can a heading keyword list, because
# "Average Relief" is named as a relief and behaves as an average.
#
# So a mechanism is defined here by the STRUCTURAL SLOTS its text must contain. The
# name is recorded as a hint and is never load-bearing.
#
# HOW IT IS USED  (see align.py)
#   PROPOSE  a candidate span is offered for a mechanism        - may be wrong
#   VERIFY   every mandatory slot must match, no negative slot may match  - decides
#   BIND     only a verified alignment becomes a fact a rule may rest on
#
# The proposer gets no vote. A rejected proposal is recorded and displayed, because
# the rejections are the evidence that the verifier is load-bearing rather than
# decorative.
#
# SLOT SEMANTICS
#   mandatory_slots  ALL must match inside the candidate span, or the span is rejected
#   negative_slots   ANY match rejects the span. These separate mechanisms that share
#                    vocabulary — see MEASURED NOTE on ADEQ.PROPORTIONATE_REDUCTION
#   optional_slots   extracted when present; absence is a finding, never a default
#
# Every pattern below was run against the seven published wordings in the document
# corpus before being committed. Patterns are case-insensitive and whitespace-tolerant,
# because pypdf emits hard newlines mid-sentence.

meta:
  version: 1
  # Corpus ids. corpus/manifest.yaml records the publisher, source URL and sha256 of
  # the exact bytes each pattern was tested against; the documents themselves are
  # third-party material and live outside git.
  tested_against:
    - sg-chubb-selectplus-lite-wording       # verified by hand
    - sg-msig-sumo-wording                   # verified by hand
    - sg-liberty-smecare-wording             # verified by hand
    - my-aig-sme-fire-and-perils-wording     # never hand-mapped
    - my-qbe-retail-package-wording          # never hand-mapped
    - my-qbe-industrial-all-risk-wording     # never hand-mapped
    - my-aig-all-risks-and-bi-wording        # never hand-mapped
    - sg-aig-homes-advantage-wording         # T26 home mechanisms, hand-checked
    - in-hdfc-ergo-bharat-griha-raksha-wording   # T26 India home mechanisms, hand-checked
    - sg-aig-travel-guard-direct-wording     # T26 travel mechanisms, hand-checked
    - hk-vhis-standard-plan-template         # T27 VHIS Standard Plan mechanisms, hand-checked
  note: >
    Malaysian wordings are included to test whether the method generalises to a
    carrier nobody has read. They must never be cited as Singapore market positions.

mechanisms:

  # ───────────────────────────────────────────────────────────────────────────
  ADEQ.PROPORTIONATE_REDUCTION:
    label: Proportionate reduction of payment for under-insurance
    taxonomy_code: ADEQ.AVERAGE_CONDITION
    known_names:
      - Average
      - Average Relief
      - Underinsurance
      - Under-insurance
      - Condition of Average
      - Basis of Settlement
      - Pro-rata condition
    # MEASURED NOTE — why negative_slots exist at all.
    # A first version of this mechanism used only the two mandatory slots below and
    # wrongly verified a CONTRIBUTION clause in the QBE industrial wording.
    # Contribution apportions a loss between two INSURERS and shares the phrase
    # "rateable proportion" with average. Average apportions a loss between the
    # insurer and the INSURED, by reference to a value at risk. The vocabulary
    # overlaps; the comparison does not. Hence: a mandatory comparison against a
    # value at risk, and a negative slot for the other-insurance framing.
    mandatory_slots:
      comparison_to_value_at_risk:
        description: >
          A comparison of the sum insured against the value actually at risk. This is
          what separates average from contribution.
        any_of:
          - 'greater value than the sum insured'
          - 'exceeds? the sum insured'
          - 'less than \s*\d{2}\s*%? of the (?:actual|replacement|reinstatement)'
          - 'value of all property'
          - 'total value of the property insured'
          - 'collectively of greater value'
          - 'sum insured (?:bears|shall bear) to the value'
          - 'value of the property (?:insured )?at the time of'
          - 'representing \d{2}\s*%? of the total reinstatement'
      reduction_consequence:
        description: A consequence that reduces the amount otherwise payable.
        any_of:
          - 'proportionately reduced'
          - 'rate-?able proportion'
          - 'proportionate(?:ly)? share'
          - 'bear a (?:rate-?able )?(?:proportion|share)'
          - 'own insurer'
          - 'considered as being (?:his|its) own insurer'
    negative_slots:
      other_insurance_apportionment:
        description: >
          Contribution / other-insurance framing. Apportionment between insurers is a
          different mechanism and must not verify as average.
        any_of:
          - 'any other insurance'
          - 'other insurances?\b'
          - 'double insurance'
          - 'contribute more than its rate-?able proportion'
          - 'covered by any other'
    optional_slots:
      threshold_pct:
        scope: clause          # a percentage from an adjacent clause is not this one's
        description: The percentage below which the mechanism engages.
        capture: '(\d{2})\s*(?:%|per cent)'
      stated_formula:
        description: >
          The arithmetic itself, where the wording states it. Liberty states it;
          Chubb and MSIG say "proportionately reduced" and stop.
        any_of:
          - 'such proportion of the loss(?: or damage)? as the sum insured bears'
          - 'which the said difference bears'
      settlement_basis:
        scope: clause          # must NOT be read from a neighbouring provision
        description: >
          Which valuation basis the mechanism attaches to. MEASURED NOTE: an earlier
          version matched the bare word "reinstatement" anywhere in the candidate
          window, and reported Chubb cl 4.2 as REINSTATEMENT when its own text says
          "the actual value". The window spans neighbouring clauses, so a loose
          keyword picks up the wrong clause's basis. The patterns below are therefore
          tied to the COMPARISON language itself — the basis is a property of what the
          clause compares against, not of a word appearing nearby.
        map:
          REINSTATEMENT: 'of the total reinstatement cost|reinstatement cost which would have been incurred|% of the reinstatement'
          ACTUAL_VALUE: 'of the actual value|actual value of the (?:property|insured)'
          VALUE: 'value of all property|total value of the property insured|collectively of greater value'

  # ───────────────────────────────────────────────────────────────────────────
  COND.PREMIUM_PAYMENT_WARRANTY:
    label: Premium payment warranty with automatic termination
    taxonomy_code: COND.PREMIUM_PAYMENT_WARRANTY
    known_names:
      - Premium Payment Warranty
      - Premium Warranty
      - Payment of Premium
    note: >
      The one market-uniform mechanism in the Singapore corpus, because the General
      Insurance Association of Singapore standardised it. Identical to the dollar
      across Chubb, MSIG and Liberty. Expect near-verbatim matches.
    mandatory_slots:
      period:
        description: The payment window.
        any_of:
          - '\b60\s*(?:\(sixty\)\s*)?days?'
          - 'sixty\s*\(?60\)?\s*days?'
      automatic_consequence:
        description: Automatic termination of cover on expiry of the window.
        any_of:
          - 'automatically terminat'
          - 'deemed to be cancelled'
          - 'cover .{0,40}(?:shall|is) (?:be )?terminated'
    optional_slots:
      minimum_premium:
        capture: 'minimum of \s*(?:S\$|SGD)\s*([\d,]+(?:\.\d{2})?)'
      without_prejudice:
        any_of:
          - 'without prejudice to any liability incurred'
      section_carve_out:
        description: MSIG excludes Work Injury Compensation; WICA cover is compulsory.
        any_of:
          - 'except Section \d+.{0,40}Work Injury'
          - 'apply to whole policy except'

  # ───────────────────────────────────────────────────────────────────────────
  COND.UNOCCUPANCY:
    label: Unoccupancy or vacancy trigger
    taxonomy_code: COND.UNOCCUPANCY
    known_names:
      - Vacant
      - Unoccupied
      - Unoccupancy
      - Untenanted
    note: >
      The day count is NOT a market constant. Chubb 14, MSIG 30, Liberty 30 in most
      sections and 7 in another. Every alignment carries its own count; nothing here
      may be lifted to a carrier-level default.
    mandatory_slots:
      unoccupancy_state:
        any_of:
          - '\bvacant\b'
          - 'un-?occupied'
          - 'untenanted'
          - 'without an inhabitant'
      duration:
        description: A stated period. A trigger with no period is not this mechanism.
        any_of:
          - '\b(?:\d{1,3}|seven|fourteen|thirty|sixty)\s*(?:consecutive\s*)?days?'
    optional_slots:
      days:
        scope: clause          # Liberty states 30 and 7 in different sections
        capture: '\b(\d{1,3})\s*(?:consecutive\s*)?days?'
      days_word:
        scope: clause
        map:
          '7': 'seven\s*(?:consecutive\s*)?days'
          '14': 'fourteen\s*(?:consecutive\s*)?days'
          '30': 'thirty\s*(?:consecutive\s*)?days'
          '60': 'sixty\s*(?:consecutive\s*)?days'
      instrument:
        description: >
          An exclusion narrows one peril. An alteration or avoidance provision can
          reach the whole policy. The distinction changes the consequence.
        map:
          ALTERATION_AVOIDANCE: 'alter|avoid|cease to attach|no liability under this'
          PERIL_EXCLUSION: 'exclud|shall not (?:be liable|cover)|not insured'

  # ───────────────────────────────────────────────────────────────────────────
  COND.DECLARATION_CLAUSE_GENERAL:
    label: General clause making compliance a condition precedent to liability
    taxonomy_code: COND.DECLARATION_CLAUSE_GENERAL
    known_names:
      - Conditions Precedent
      - Observance of Conditions
      - Basis of Contract
      - General Declaration
    note: >
      Present in MSIG (sweeping), absent in Chubb, arbitration-only in Liberty. This
      mechanism is located and quoted and NEVER adjudicated: Grace Electrical v EQ
      Insurance [2016] SGHC 233 at [17]-[25] holds the label is not decisive and each
      clause must be construed individually.
    mandatory_slots:
      condition_precedent_language:
        any_of:
          - 'conditions? precedent to any liability'
          - 'conditions? precedent to (?:the )?liability'
          - 'shall be conditions? precedent'
      scope_is_general:
        description: >
          It must attach to the terms generally, not to a single discrete obligation.
          An arbitration-award precondition is not this mechanism.
        any_of:
          - 'due observance'
          - 'terms and conditions of (?:the|this) polic'
          - 'anything to be done or complied with'
          - 'truth of the statements'
    negative_slots:
      arbitration_only:
        description: >
          Liberty and MSIG both make an arbitration award a condition precedent to
          suing. That is a procedural precondition, not a general compliance
          declaration, and must not verify as one.
        any_of:
          - 'making of an? (?:award|Award)'
          - 'arbitration award shall be first obtained'
    engine_behaviour: LOCATE_QUOTE_ESCALATE
    never: ADJUDICATE

  # ───────────────────────────────────────────────────────────────────────────
  # Health mechanisms use the same propose -> verify -> bind discipline. A familiar
  # heading alone is never enough: each term must contain its operative structure.
  HEALTH.WAITING.PED:
    label: Pre-existing disease waiting period
    taxonomy_code: HEALTH.WAITING.PED
    known_names: [Pre-Existing Disease, PED]
    mandatory_slots:
      pre_existing_condition:
        any_of: ['pre\s*-\s*existing\s+disease']
      time_until_expiry:
        any_of: ['expiry of\s*\d+\s*months?']
      continuous_cover_basis:
        any_of: ['continuous\s+coverage']

  HEALTH.LIMIT.ROOM_RENT:
    label: Room-rent daily cap
    taxonomy_code: HEALTH.LIMIT.ROOM_RENT
    known_names: [Room Rent]
    mandatory_slots:
      room_charge:
        any_of: ['room\s+rent']
      sum_insured_percentage:
        any_of: ['\d+\s*%\s+of\s+the\s+sum\s+insured']
      daily_cap:
        any_of: ['per\s+day']
    optional_slots:
      cap_amount:
        capture: '(?:Rs\.?|INR)\s*([\d,]+)'

  HEALTH.SHARE.CO_PAYMENT:
    label: Co-payment condition
    taxonomy_code: HEALTH.SHARE.CO_PAYMENT
    known_names: [Co-payment, Co-payment]
    mandatory_slots:
      all_claims_scope:
        any_of: ['each\s+and\s+every\s+claim']
      percentage_share:
        any_of: ['co\s*-\s*payment\s+of\s+\d+\s*%']
    optional_slots:
      percentage:
        capture: 'co\s*-\s*payment\s+of\s+(\d+)\s*%'

  HEALTH.CLAIM.MORATORIUM:
    label: Moratorium period
    taxonomy_code: HEALTH.CLAIM.MORATORIUM
    known_names: [Moratorium]
    mandatory_slots:
      continuous_months:
        any_of: ['(?:sixty|\d+)\s+continuous\s+months']
      moratorium_label:
        any_of: ['moratorium\s+period']

  HEALTH.CLAIM.CASHLESS:
    label: Cashless network and pre-authorisation condition
    taxonomy_code: HEALTH.CLAIM.CASHLESS
    known_names: [Cashless claims]
    mandatory_slots:
      network_provider:
        any_of: ['treatment\s+may\s+be\s+taken\s+in\s+a\s+network\s+provider']
      pre_authorisation:
        any_of: ['preauthorization|pre-authorisation']

  HEALTH.SG.PRO_RATION:
    label: Higher-ward pro-ration condition
    taxonomy_code: HEALTH.SG.PRO_RATION
    known_names: [Pro-ration factor]
    mandatory_slots:
      pro_ration_factor:
        any_of: ['pro\s*-\s*ration\s+factor']
      higher_ward_context:
        any_of: ['higher\s+class\s+wards?|private\s+hospital']
      computation_context:
        any_of: ['claims?\s+computation']

  HEALTH.WAITING.INITIAL:
    label: Initial health waiting period
    taxonomy_code: HEALTH.WAITING.INITIAL
    known_names: [First Thirty Days Waiting Period]
    mandatory_slots:
      waiting_label:
        any_of: ['first\s+(?:thirty|\d+)\s+days\s+waiting\s+period']
      commencement_basis:
        any_of: ['first\s+policy\s+commencement\s+date']

  HEALTH.WAITING.SPECIFIC:
    label: Specific-disease waiting period
    taxonomy_code: HEALTH.WAITING.SPECIFIC
    known_names: [Specific Waiting Period]
    mandatory_slots:
      waiting_label:
        any_of: ['specific\s+waiting\s+period']
      continuous_coverage:
        any_of: ['(?:24\s*/\s*36|\d+)\s+months\s+of\s+continuous\s+coverage']

  HEALTH.LIMIT.ICU_DAILY:
    label: Intensive-care daily limit
    taxonomy_code: HEALTH.LIMIT.ICU_DAILY
    known_names: [ICU, Intensive Care Unit]
    mandatory_slots:
      intensive_care:
        any_of: ['intensive\s+care\s+unit|ICU/ICCU']
      daily_limit:
        any_of: ['per\s+day']
    optional_slots:
      cap_amount:
        capture: '(?:Rs\.?|S\$|\$)\s*([\d,]+)\s+per\s+day'

  HEALTH.CONDITION.PROPORTIONATE_DEDUCTION:
    label: Room-category proportionate deduction condition
    taxonomy_code: HEALTH.CONDITION.PROPORTIONATE_DEDUCTION
    known_names: [Proportionate deductions]
    mandatory_slots:
      room_or_icu_trigger:
        any_of: ['room/ICU/ICCU']
      stated_proportion:
        any_of: ['same\s+proportion\s+as\s+the\s+admissible\s+rate']
      actual_rate_basis:
        any_of: ['actual\s+rate\s+per\s+day']

  HEALTH.CONDITION.DAY_CARE:
    label: Day-care hospitalisation condition
    taxonomy_code: HEALTH.CONDITION.DAY_CARE
    known_names: [Day Care Treatment]
    mandatory_slots:
      day_care:
        any_of: ['day\s+care\s+treatment']
      minimum_stay_exception:
        any_of: ['time\s+limit\s+shall\s+not\s+apply']

  HEALTH.LIMIT.PRE_HOSPITALISATION:
    label: Pre-hospitalisation day limit
    taxonomy_code: HEALTH.LIMIT.PRE_HOSPITALISATION
    known_names: [Pre-Hospitalization]
    mandatory_slots:
      pre_hospitalisation:
        any_of: ['pre\s*-\s*hospitalization']
      stated_days:
        any_of: ['fixed\s+period\s+of\s+\d+\s+days\s+prior']
    optional_slots:
      days:
        capture: 'fixed\s+period\s+of\s+(\d+)\s+days\s+prior'

  HEALTH.LIMIT.POST_HOSPITALISATION:
    label: Post-hospitalisation day limit
    taxonomy_code: HEALTH.LIMIT.POST_HOSPITALISATION
    known_names: [Post Hospitalisation]
    mandatory_slots:
      post_hospitalisation:
        any_of: ['post\s+hospitalisation']
      stated_days:
        any_of: ['fixed\s+period\s+of\s+\d+\s+days\s+from\s+the\s+date\s+of\s+discharge']
    optional_slots:
      days:
        capture: 'fixed\s+period\s+of\s+(\d+)\s+days\s+from\s+the\s+date\s+of\s+discharge'

  HEALTH.LIMIT.CUMULATIVE_BONUS:
    label: Cumulative-bonus condition
    taxonomy_code: HEALTH.LIMIT.CUMULATIVE_BONUS
    known_names: [Cumulative Bonus]
    mandatory_slots:
      bonus_label:
        any_of: ['cumulative\s+bonus']
      increase:
        any_of: ['increased\s+by\s+\d+\s*%']
      maximum:
        any_of: ['maximum\s+of\s+\d+\s*%\s+of\s+the\s+sum\s+insured']
    optional_slots:
      percentage:
        capture: 'increased\s+by\s+(\d+)\s*%'
      maximum_percentage:
        capture: 'maximum\s+of\s+(\d+)\s*%\s+of\s+the\s+sum\s+insured'

  HEALTH.DEADLINE.CLAIM_INTIMATION:
    label: Claim-intimation timing condition
    taxonomy_code: HEALTH.DEADLINE.CLAIM_INTIMATION
    known_names: [Notification of Claim]
    mandatory_slots:
      notification:
        any_of: ['notification\s+of\s+claim']
      emergency_timing:
        any_of: ['within\s+\d+\s+hours\s+from\s+the\s+date\s+of\s+emergency\s+hospitalization']
    optional_slots:
      hours:
        capture: 'within\s+(\d+)\s+hours\s+from\s+the\s+date\s+of\s+emergency\s+hospitalization'

  HEALTH.CONDITION.REIMBURSEMENT:
    label: Reimbursement-claim procedure condition
    taxonomy_code: HEALTH.CONDITION.REIMBURSEMENT
    known_names: [Procedure for reimbursement of claims]
    mandatory_slots:
      reimbursement_procedure:
        any_of: ['procedure\s+for\s+reimbursement\s+of\s+claims']
      document_submission:
        any_of: ['claim\s+documents']

  HEALTH.SG.WARD_ENTITLEMENT:
    label: Standard-plan ward entitlement
    taxonomy_code: HEALTH.SG.WARD_ENTITLEMENT
    known_names: [Hospital ward type]
    mandatory_slots:
      ward_label:
        any_of: ['hospital\s+ward\s+type']
      b1_ward:
        any_of: ['B1\s+standard\s+ward']
      public_hospital:
        any_of: ['public\s+hospital']
  # ───────────────────────────────────────────────────────────────────────────
  # Home and travel mechanisms (T26). Same propose -> verify -> bind discipline as the
  # SME and health entries: each one names the operative STRUCTURE of the sentence, never
  # a heading or a clause number. Tested against the three public home and travel
  # wordings in the corpus, and against every other corpus wording for false positives.
  HOME.COVERED.CONTENTS:
    label: Household contents insuring clause
    taxonomy_code: HOME.COVERED.CONTENTS
    known_names: [Household Contents, Home Contents, General Contents]
    mandatory_slots:
      contents_subject:
        any_of:
          - 'loss or damage to (?:the )?Household Contents in Y\s?our Residence'
          - 'physical loss or damage to\s*or\s*destruction of the General Contents of Y\s?our Home'
      limit_reference:
        any_of:
          - 'up to the maximum annual limit as specified in the policy'
          - 'caused by an Insured Event'
  HOME.LIMIT.SINGLE_ARTICLE:
    label: Single-article limit for contents
    taxonomy_code: HOME.LIMIT.SINGLE_ARTICLE
    known_names: [per article]
    mandatory_slots:
      per_article_cap:
        any_of: ['no more than \$?\s?[\d,]+ per article']
      itemised_exception:
        any_of: ['unless specifically itemi[sz]ed']
    optional_slots:
      amount:
        scope: clause
        capture: 'no more than \$?\s?([\d,]+) per article'
  HOME.ADEQ.INSURANCE_TO_VALUE:
    label: Insurance to value (proportion of sum insured to replacement value)
    taxonomy_code: ADEQ.AVERAGE_CONDITION
    known_names: [Insurance to Value, Average, Underinsurance]
    mandatory_slots:
      sum_insured_below_value:
        any_of:
          - 'sum insured as specified in the policy schedule[\s\S]{0,220}?is lower than the actual value to replace'
      proportionate_consequence:
        any_of:
          - 'based on the proportion of the sum insured to the actual replacement value'
    negative_slots:
      other_insurance_apportionment:
        any_of: ['any other insurance', 'double insurance', 'contribute more than its rate-?able proportion']
  HOME.CONDITION.SETTLEMENT_BASIS:
    label: Basis of settlement (repair or replacement as new)
    taxonomy_code: HOME.CONDITION.SETTLEMENT_BASIS
    known_names: [Basis of Settlement]
    mandatory_slots:
      partial_loss_basis:
        any_of: ['cost of repairs following (?:a )?partial damage']
      total_loss_basis:
        any_of: ['replacement as new following total loss']
  HOME.EXCL.THEFT_FORCIBLE_ENTRY:
    label: Theft covered only on violent and forcible entry
    # The existing taxonomy mechanism, reused: a theft peril that depends on forcible
    # entry. The structural slots below are the residential form of it.
    taxonomy_code: EXCL.THEFT_FORCIBLE_ENTRY
    known_names: [Theft, Forcible Entry]
    mandatory_slots:
      forcible_entry_theft:
        any_of: ['theft by violent and forcible entry']
      occupancy_proviso:
        any_of: ['not left unoccupied for more than']
    optional_slots:
      days:
        scope: clause
        capture: 'unoccupied for more than\s*(\d{1,3})\s*consecutive\s*days'
  HOME.DEADLINE.CLAIM_NOTICE:
    label: Written notice of an occurrence within a stated period
    taxonomy_code: HOME.DEADLINE.CLAIM_NOTICE
    known_names: [Notification and Claims Procedures]
    mandatory_slots:
      written_notice:
        any_of: ['written notice to Us of the occurrence']
      time_limit:
        any_of: ['no later than [a-z]+ \(\d+\) days', 'no later than \d+ days']
    optional_slots:
      days:
        scope: clause
        capture: 'no later than [a-z]+ \((\d+)\) days'
  HOME.CONDITION.POLICE_REPORT:
    label: Police report for theft
    taxonomy_code: HOME.CONDITION.POLICE_REPORT
    known_names: [police report]
    mandatory_slots:
      theft_event:
        any_of: ['in the case of theft']
      police_report:
        any_of: ['lodge an official report with the police']
  HOME.IN.BASIS.COST_OF_CONSTRUCTION:
    label: Building sum insured on the cost-of-construction basis
    taxonomy_code: HOME.IN.BASIS.COST_OF_CONSTRUCTION
    known_names: [Cost of Construction]
    mandatory_slots:
      construction_basis:
        any_of: ['Sum Insured for the Home Building Cover is the\s*prevailing Cost of Construction']
      total_loss_maximum:
        any_of: ['maximum amount\s*payable in the event the Home Building is a Total\s*Loss']
  HOME.IN.CONTENTS.BUILT_IN:
    label: Built-in general contents cover as a share of the building sum insured
    taxonomy_code: HOME.IN.CONTENTS.BUILT_IN
    known_names: [built-in cover]
    mandatory_slots:
      built_in_cover:
        any_of: ['built-in cover for the General\s*Contents']
      share_of_building:
        any_of: ['equal to \d+% of the Sum\s*Insured for Home Building']
    optional_slots:
      percent:
        scope: clause
        capture: 'equal to (\d+)% of the Sum'
      maximum_lakh:
        scope: clause
        capture: 'maximum of\s*\S{0,3}\s*(\d+) Lakh'
  HOME.IN.WAIVER.UNDERINSURANCE:
    label: Underinsurance waived
    taxonomy_code: HOME.IN.WAIVER.UNDERINSURANCE
    known_names: [Waiver of Underinsurance]
    mandatory_slots:
      waiver:
        any_of: ['Underinsurance does not apply']
      value_comparison:
        any_of: ['less than the actual value at\s*risk, the difference will not affect the amount We pay']
  HOME.IN.THEFT.AFTER_INSURED_EVENT:
    label: Theft covered only after an insured event
    taxonomy_code: HOME.IN.THEFT.AFTER_INSURED_EVENT
    known_names: [Theft]
    mandatory_slots:
      theft_window:
        any_of: ['Theft within \d+ \(\w+\) days']
      insured_event_cause:
        any_of: ['proximately caused by any\s*of the above Insured Events']
    optional_slots:
      days:
        scope: clause
        capture: 'Theft within (\d+) \('
  HOME.IN.DEADLINE.IMMEDIATE_NOTICE:
    label: Immediate notice of loss or damage
    taxonomy_code: HOME.IN.DEADLINE.IMMEDIATE_NOTICE
    known_names: [Immediate notice]
    mandatory_slots:
      trigger:
        any_of: ['As soon as any physical loss or damage occurs']
      immediate_notice:
        any_of: ['Y\s?ou must immediately give notice to\s*Us of the loss or damage']
  TRAVEL.COVERED.CANCELLATION:
    label: Trip cancellation before departure
    taxonomy_code: TRAVEL.COVERED.CANCELLATION
    known_names: [Cancellation of your trip]
    mandatory_slots:
      unavoidable_cancellation:
        any_of: ['necessary and unavoidable that you have to cancel your trip']
      covered_events:
        any_of: ['one \(1\) or more of the covered events', 'covered events']
  TRAVEL.COVERED.OVERSEAS_MEDICAL:
    label: Overseas medical expenses
    taxonomy_code: TRAVEL.COVERED.OVERSEAS_MEDICAL
    known_names: [Overseas medical expenses]
    mandatory_slots:
      reimbursement:
        any_of: ['reimburse you for the necessary and reasonable medical expenses you incurred and paid overseas']
      treatment_window:
        any_of: ['within [a-z]+ \(\d+\) days of an injury or illness']
    optional_slots:
      days:
        scope: clause
        capture: 'within [a-z]+ \((\d+)\) days of an injury'
  TRAVEL.CONDITION.BAGGAGE_DELAY:
    label: Baggage delay threshold
    taxonomy_code: TRAVEL.CONDITION.BAGGAGE_DELAY
    known_names: [Baggage delay]
    mandatory_slots:
      delayed_baggage:
        any_of: ['baggage is delayed for collection']
      threshold:
        any_of: ['for more than [a-z]+ \(\d+\) continuous\s*hours']
    optional_slots:
      hours:
        scope: clause
        capture: 'for more than [a-z]+ \((\d+)\) continuous'
  TRAVEL.CONDITION.CARRIER_REPORT:
    label: Carrier's property irregularity report
    taxonomy_code: TRAVEL.CONDITION.CARRIER_REPORT
    known_names: [Property Irregularity Report]
    mandatory_slots:
      carrier_report:
        any_of: ['property irregularity report']
      carrier_context:
        any_of: ['damage by an airline', 'flight tickets and baggage check tags']
  TRAVEL.EXCLUSION.EXISTING_CONDITION:
    label: Existing health condition exclusion
    taxonomy_code: TRAVEL.EXCLUSION.EXISTING_CONDITION
    known_names: [existing health conditions, pre-existing conditions]
    mandatory_slots:
      exclusion:
        any_of:
          - 'does not cover any (?:pre-)?existing health conditions?'
          # The same structure in a second carrier's words (the GENERIC showcase wording).
          - 'pre-existing medical conditions of you or any other person are not covered'
  TRAVEL.DEADLINE.CLAIM_NOTICE:
    label: Claim documents within a stated period
    taxonomy_code: TRAVEL.DEADLINE.CLAIM_NOTICE
    known_names: [Notice of Claim]
    mandatory_slots:
      submission:
        any_of: ['Claims documents must be submitted']
      time_limit:
        any_of: ['no later than [a-z]+ \(\d+\) days from the date of\s*the incident']
    optional_slots:
      days:
        scope: clause
        capture: 'no later than [a-z]+ \((\d+)\) days from the date'

  # ───────────────────────────────────────────────────────────────────────────
  # Hong Kong VHIS Standard Plan mechanisms (T27). Structural, like the rest: each names
  # what the government template's own sentences contain. Tested against the template and
  # against every other corpus wording for false positives.
  HEALTH.HK.GUARANTEED_RENEWAL:
    label: Guaranteed renewal regardless of health changes
    taxonomy_code: HEALTH.HK.GUARANTEED_RENEWAL
    known_names: [guaranteed renewal]
    mandatory_slots:
      guaranteed_renewal:
        any_of: ['guaranteed renewal rights, despite changes to the health conditions']
      age_ceiling:
        any_of: ['up to the age of \d+']
    optional_slots:
      age:
        scope: clause
        capture: 'up to the age of (\d+)'
  HEALTH.HK.UNKNOWN_PRE_EXISTING:
    label: Unknown pre-existing conditions under a stepped waiting period
    taxonomy_code: HEALTH.HK.UNKNOWN_PRE_EXISTING
    known_names: [Pre-existing Condition]
    mandatory_slots:
      unknown_condition:
        any_of: ['Pre-existing Condition\(s\) that the Policy Holder and/or Insured Person\s*was not aware']
      stepped_arrangement:
        any_of: ['waiting period and reimbursement arrangement']
      second_year_share:
        any_of: ['Second Policy Year \d+% reimbursement']
    optional_slots:
      # Candidate scope: the stepped table sits just past the clause's opening sentence,
      # and each row is labelled by its own policy year, so it cannot be borrowed.
      second_year_percent:
        scope: candidate
        capture: 'Second Policy Year (\d+)% reimbursement'
  HEALTH.HK.ROOM_AND_BOARD:
    label: Room and board daily limit with an annual day cap
    taxonomy_code: HEALTH.HK.ROOM_AND_BOARD
    known_names: [Room and board]
    mandatory_slots:
      room_and_board:
        any_of: ['Room and board\s*\$[\d,]+ per day']
      day_cap:
        any_of: ['Maximum \d+ days per Policy Year']
    optional_slots:
      amount:
        scope: clause
        capture: 'Room and board\s*\$([\d,]+) per day'
      days:
        scope: clause
        capture: 'Maximum (\d+) days per Policy Year'
  HEALTH.HK.ANNUAL_LIMIT:
    label: Annual benefit limit
    taxonomy_code: HEALTH.HK.ANNUAL_LIMIT
    known_names: [Annual Benefit Limit]
    mandatory_slots:
      # One slot, so the bound region centres on the limit row itself rather than on an
      # earlier per-year sub-limit in the same table.
      annual_limit_amount:
        any_of: ['Annual Benefit Limit for benefit\s*items[^$]{0,30}\$[\d,]+ per Policy Year']
    optional_slots:
      amount:
        scope: clause
        capture: 'Annual Benefit Limit for benefit\s*items[^$]{0,30}\$([\d,]+) per Policy Year'
  HEALTH.HK.NO_LIFETIME_LIMIT:
    label: No lifetime benefit limit
    taxonomy_code: HEALTH.HK.NO_LIFETIME_LIMIT
    known_names: [Lifetime Benefit Limit]
    mandatory_slots:
      no_lifetime_limit:
        any_of: ['not subject to any Lifetime Benefit Limit', 'no lifetime benefit limit']
