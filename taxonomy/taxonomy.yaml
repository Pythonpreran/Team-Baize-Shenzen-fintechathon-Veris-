# ─────────────────────────────────────────────────────────────────────────────
# NON-INSURANCE DOCUMENTS — the operands that make PROVEN findings possible.
# ─────────────────────────────────────────────────────────────────────────────
EXPOSURE:
  CPF.CONTRIBUTOR_COUNT:
    label: Employee count from CPF contribution record
    author_class: AUTHORITY
    grades_as: PROVEN
  WIC.DECLARED_HEADCOUNT:
    label: Headcount declared on the work injury policy schedule
    author_class: INSURER
    grades_as: PROVEN
  WIC.OCCUPATIONAL_CLASS:
    label: Occupational class declared to the work injury insurer
    author_class: INSURER
    grades_as: PROVEN
  WORKPASS.HOLDER_LIST:
    label: Work Permit / S Pass holder list
    author_class: AUTHORITY
    grades_as: PROVEN
  TENANCY.PERMITTED_USE:
    label: Permitted use covenant in the tenancy agreement
    author_class: THIRD_PARTY
    grades_as: PROVEN
  ACRA.SSIC_CODE:
    label: SSIC 2025 activity code from ACRA
    author_class: AUTHORITY
    grades_as: PROVEN
  INVOICE.EQUIPMENT_VALUE:
    label: Equipment or plant value from a supplier invoice
    author_class: THIRD_PARTY
    grades_as: PROVEN
  ACCOUNTS.STOCK_VALUE:
    label: Stock / inventory value from balance sheet or management accounts
    author_class: SELF
    grades_as: DECLARED
    note: >
      Deliberately DECLARED, not PROVEN. The business authored it. The GST F5
      return does NOT carry a closing stock figure — its boxes cover supplies,
      taxable purchases and output/input tax only. Do not source stock from F5.
  GST.TURNOVER:
    label: Declared supplies / turnover from GST F5 return
    author_class: AUTHORITY
    grades_as: PROVEN
    note: What the F5 does report.
  RCA.BUILDING_VALUE:
    label: Building reinstatement cost on a RICS basis
    author_class: THIRD_PARTY
    grades_as: PROVEN
    if_absent: UNESTABLISHED

# ─────────────────────────────────────────────────────────────────────────────
# UNACCOUNTED — the bucket that makes the completeness metric real.
# ─────────────────────────────────────────────────────────────────────────────
UNACCOUNTED:
  label: Operative provision detected but not classified
  must_be_quoted: true
  must_be_counted: true
  invariant: "classified + unaccounted == detected"
