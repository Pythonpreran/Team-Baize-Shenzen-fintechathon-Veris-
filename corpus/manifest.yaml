# VERIS document corpus — manifest
#
# WHAT THIS IS. Every third-party document the engine reads but MUST NOT redistribute:
# insurer policy wordings, schedules, brochures, statute text and one judgment. The
# files themselves live OUTSIDE this repository, in the corpus directory
# (`VERIS_CORPUS_DIR`, default `../veris-corpus`), which is gitignored. This manifest
# is the committed part: it records what each document is, who published it, where it
# came from, and the exact bytes we read — so any figure the product quotes can be
# re-fetched and re-checked at source by someone who has only the repository.
#
# WHY NOT COMMIT THE DOCUMENTS. They are other people's copyrighted material. We have
# a reader's right to them, not a publisher's. `redistribute: false` is on every entry
# and `scripts/scan_repo.py` fails the build if one of them is ever committed.
#
# HOW IT IS POPULATED. `scripts/fetch_corpus.py --seed-from <dir>` copies from a local
# directory (the primary path, and the one CI and a new machine use), verifies the
# sha256 below, and extracts page-marked text. With no `--seed-from` it downloads from
# `source_url` instead. Either way a hash that does not match is reported, never
# silently accepted.
#
# FIELDS
#   id                  stable key. Code resolves documents by this, never by path.
#   title/publisher     what it is and who wrote it. `publisher` is also the basis of
#                       the document's author class, which is what evidence class
#                       derives from — so it is never guessed.
#   source_url          the URL the file was retrieved from.
#   source_url_status   RECORDED when the team captured the URL at retrieval time;
#                       UNRECORDED when it did not. An UNRECORDED entry can still be
#                       seeded from a local copy but CANNOT be downloaded, and it is
#                       logged in the team's action log for re-sourcing.
#                       We do not invent a URL to fill the field.
#   country             jurisdiction the document belongs to. Load-bearing: a Malaysian
#                       wording must never be cited for a Singapore question.
#   line_of_business    SME_PACKAGE | HOME | MARINE | NOT_APPLICABLE
#   document_class      POLICY_WORDING | BENEFITS_SCHEDULE | PROPOSAL_FORM | FACTSHEET
#                       | BROCHURE | WEBPAGE | STATUTE | JUDGMENT | PRACTICE_GUIDE
#                       Load-bearing in the same way: a brochure is not authority for
#                       what a policy says, and the class is what stops it being used
#                       as one.
#   media_type          application/pdf (original is a PDF, text is extracted) or
#                       text/plain (the retrieval itself was text).
#   seed_path           path relative to the seed directory (default `../06-evidence`).
#   sha256/bytes        of the file at `seed_path`. Verified on every fetch.
#   pages               counted `=== PAGE n ===` markers, not an estimate. 0 means the
#                       retrieval was HTML and has no pagination.
#   redistribute        always false. There is no entry for which this is true.
#   usage_note          what the document is used for, and what it is not authority for.
#   text                optional. A text extraction the team has already verified, used
#                       in preference to re-extracting. Only set where one exists.

version: 1

