# VERIS jurisdiction pack — mainland China (T28, standard depth).
#
# Every statement about law or regulation is either backed by a verbatim primary-source
# quote that scripts/verify_pack_sources.py has checked, or held as CANDIDATE evidence that
# never reaches an owner. On 2026-10-11 the build read the National People's Congress's
# English texts of the Insurance Law (2009 revision) and the Personal Information
# Protection Law, but only over plain HTTP: the NPC sites present no valid HTTPS
# certificate, and the pack validator accepts only HTTPS sources, because a quote read over
# an unauthenticated connection cannot be shown to be the publisher's. Those entries are
# CANDIDATE, with the text read kept in each note for the evidence view and the exact human
# action logged. The State Council page tried for the compulsory motor insurance regulation
# returned HTTP 404. The one owner-facing entry quotes the National Financial Regulatory
# Administration's own HTTPS home page: its consumer complaint hotline.

code: CN
name: Mainland China
version: 1
summary: >
  Mainland China. CNY money formatting, Chinese public holidays and document authorship;
  the regulator's consumer complaint hotline, quoted from its own site; and the Insurance
  Law, Personal Information Protection Law and compulsory motor insurance records held
  back until an HTTPS primary copy of their current text is verified.
locales: [zh-CN]
timezone: Asia/Shanghai
holiday_calendar:
  provider: holidays
  country: CN
  wired: true
  note: >
    The holidays provider supplies public holidays. Mainland China also moves some working
    days onto weekends around holidays; those make-up working days are not represented, so
    a weekend make-up day counts as a non-working day here. No owner-facing timeline in
    this pack is measured in working days.

currency:
  code: CNY
  symbol: "¥"
  local_symbol: "¥"
  minor_units: 2
  group_separator: ","
  decimal_separator: "."
  grouping: THREE

regulators:
  - id: CN-REG-NFRA
    title: National Financial Regulatory Administration (国家金融监督管理总局)
    statement: The regulator's own statement of its insurance supervisory role needs a primary-source quote before VERIS can show it to an owner.
    values: {short_name: NFRA}
    verification:
      status: CANDIDATE
      source_url: "https://www.nfra.gov.cn/cn/view/pages/index/index.html"
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: The home page was fetched over HTTPS and names the consumer hotline, but carries no sentence stating the regulator's role; a person must record one from its own site.

statutes:
  - id: CN-STAT-INSURANCE-LAW
    title: Insurance Law of the People's Republic of China, Article 26
    statement: The Insurance Law's limitation article needs an HTTPS primary copy of its current text before VERIS can state it to an owner.
    values: {article: "26"}
    verification:
      status: CANDIDATE
      source_url: null
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: >
        The legislature's English text of the Insurance Law (2009 revision) was read on 2026-10-11 over plain HTTP at http://www.npc.gov.cn/zgrdw/englishnpc/Law/2011-02/15/content_1620648.htm; the site offers no valid HTTPS certificate (handshake failure / hostname mismatch), so the pack cannot record it as a verified source. Text read there: "With respect to insurance other than life insurance, the period of limitation of action for an insured or beneficiary to claim indemnification or payment of the insurance benefits against the insurer shall be two years" A person must record an HTTPS primary copy of the current consolidated Chinese text.
  - id: CN-STAT-PIPL-SENSITIVE
    title: Personal Information Protection Law, Article 28
    statement: The Personal Information Protection Law's definition of sensitive personal information needs an HTTPS primary copy before VERIS can state it to an owner.
    values: {article: "28"}
    verification:
      status: CANDIDATE
      source_url: null
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: >
        The legislature's English text of the Personal Information Protection Law was read on 2026-10-11 over plain HTTP at http://en.npc.gov.cn.cdurl.cn/2021-12/29/c_694559_2.htm; the site offers no valid HTTPS certificate (handshake failure / hostname mismatch), so the pack cannot record it as a verified source. Text read there: "including information such as biometrics, religious belief, specific identity, medical health status, financial accounts, and the person's whereabouts, as well as the personal information of a minor under the age of 14 years" A person must record an HTTPS primary copy of the current consolidated Chinese text.
  - id: CN-STAT-CTALI
    title: Regulation on Compulsory Traffic Accident Liability Insurance for Motor Vehicles (机动车交通事故责任强制保险条例)
    statement: The regulation's compulsory insurance requirement needs its current text quoted before VERIS can state it to an owner.
    values: {protection: MOTOR_THIRD_PARTY}
    verification:
      status: CANDIDATE
      source_url: null
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: The State Council page tried on 2026-10-11 returned HTTP 404 and no other primary copy was found; a person must record the current text and its primary URL.

compulsory_covers:
  - id: CN-COMP-MOTOR-CTALI
    title: Compulsory motor traffic accident liability insurance (交强险)
    statement: A compulsory motor insurance statement waits for the regulation entry to be source-quoted.
    values: {protection: MOTOR_THIRD_PARTY, statute: CN-STAT-CTALI}
    verification: &candidate
      status: CANDIDATE
      source_url: null
      retrieved_on: null
      quote: null
      verified_by: null
      note: Waiting for a primary-source quote; never shown to an owner until then.

regulatory_timelines:
  - id: CN-TL-CLAIM-DETERMINATION
    title: Insurance Law, Article 23 — claim determination
    statement: The Insurance Law's claim-determination article needs an HTTPS primary copy of its current text before VERIS can state any timeline to an owner.
    values: {article: "23"}
    verification:
      status: CANDIDATE
      source_url: null
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: >
        The legislature's English text of the Insurance Law (2009 revision) was read on 2026-10-11 over plain HTTP at http://www.npc.gov.cn/zgrdw/englishnpc/Law/2011-02/15/content_1620648.htm; the site offers no valid HTTPS certificate (handshake failure / hostname mismatch), so the pack cannot record it as a verified source. Text read there: "If the circumstances are complex, the insurer shall determine the matter within 30 days, unless the insurance contract provides otherwise." A person must record an HTTPS primary copy of the current consolidated Chinese text.
complaint_ladder:
  - id: CN-CL-INSURER
    title: Insurer complaint
    statement: A primary source is required before VERIS states the insurer complaint step to an owner.
    values: {order: 1, time_limit_days: null}
    verification: *candidate
  - id: CN-CL-NFRA-HOTLINE
    title: Banking and insurance consumer complaint hotline (12378)
    statement: The regulator's own site lists 12378 as the banking and insurance consumer complaint hotline.
    values: {order: 2, hotline: "12378", time_limit_days: null}
    verification:
      status: SOURCE_QUOTED
      source_url: "https://www.nfra.gov.cn/cn/view/pages/index/index.html"
      retrieved_on: 2026-10-11
      quote: "银行业保险业消费投诉热线： 12378"
      verified_by: null
      note: Read from the regulator's own HTTPS home page. No complaint time limit is recorded without its own quote.

