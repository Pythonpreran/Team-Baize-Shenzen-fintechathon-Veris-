data_protection:
  id: CN-DP-PIPL
  title: Personal Information Protection Law (个人信息保护法), Article 29
  statement: The Personal Information Protection Law's consent rule for sensitive personal information needs an HTTPS primary copy before VERIS can state it to an owner. VERIS's own health-data consent gate applies regardless.
  values: {article: "29"}
  verification:
    status: CANDIDATE
    source_url: null
    retrieved_on: 2026-10-11
    quote: null
    verified_by: null
    note: >
      The legislature's English text of the Personal Information Protection Law was read on 2026-10-11 over plain HTTP at http://en.npc.gov.cn.cdurl.cn/2021-12/29/c_694559_2.htm; the site offers no valid HTTPS certificate (handshake failure / hostname mismatch), so the pack cannot record it as a verified source. Text read there: "For the processing of sensitive personal information, individual's separate consent shall be obtained." A person must record an HTTPS primary copy of the current consolidated Chinese text.
advice_boundary:
  product_boundary: >
    VERIS states what your documents say and where they say it. It does not recommend a
    product, an insurer or a premium, and it never suggests that you buy, cancel, switch or
    surrender cover. For advice, speak to a licensed insurance intermediary or to your insurer.
  regulatory_basis:
    id: CN-AB-INSURANCE-ADVICE
    title: Insurance advice boundary
    statement: A primary source is required before VERIS makes a China-specific statement about insurance sales or advice regulation.
    values: {}
    verification: *candidate

detection:
  governing_law:
    - '(?:适用|受|依据|按照|依照)[^。；;]{0,30}?中华人民共和国(?:的)?法律'
    - '\b(?:governed by|construed in accordance with|interpreted in accordance with|determined in accordance with)\b[^.;]{0,60}?\blaws? of (?:the )?People''s Republic of China\b'
  names:
    - 国家金融监督管理总局
    - 中国银行保险监督管理委员会
    - 中国保险监督管理委员会
    - 中华人民共和国保险法
    - 机动车交通事故责任强制保险
    - 中国保险行业协会
    - 个人信息保护法
    - National Financial Regulatory Administration
  currency_codes: [CNY, RMB]
  currency_symbols: ["￥", "人民币"]
  registration_numbers:
    # Unified social credit code (统一社会信用代码), 18 characters.
    - '(?<![0-9A-Z])[0-9A-HJ-NPQRTUWXY]{2}\d{6}[0-9A-HJ-NPQRTUWXY]{10}(?![0-9A-Z])'
  postcodes: []
  phone_numbers:
    - '\+86[\s-]?1\d'
