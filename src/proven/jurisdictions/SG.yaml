    title: Financial Advisers Act 2001
    statement: Financial advisory services in Singapore are regulated under the Financial Advisers Act 2001.
    values: {}
    verification:
      status: CANDIDATE
      source_url: "https://sso.agc.gov.sg/Act/FAA2001"
      retrieved_on: null
      quote: null
      verified_by: null
      note: Not fetched or quoted. The product boundary above does not depend on it.

# How a document is recognised as Singaporean. Weights live in jurisdiction.py, not here: they
# rank the KINDS of signal (a governing-law clause outranks a phone number everywhere), and only
# the patterns are a country's own. Patterns are matched against whitespace-normalised text.
detection:
  governing_law:
    - '\b(?:governed by|construed in accordance with|interpreted in accordance with|determined in accordance with)\b[^.;]{0,60}?\blaws? of (?:the )?(?:Republic of )?Singapore\b'
    - '\b(?:governed by|construed in accordance with|interpreted in accordance with|determined in accordance with)\b[^.;]{0,60}?\bSingapore [Ll]aw\b'
  names:
    - Monetary Authority of Singapore
    - MAS
    - Ministry of Manpower
    - Central Provident Fund
    - Accounting and Corporate Regulatory Authority
    - Personal Data Protection Commission
    - Work Injury Compensation Act
    - Personal Data Protection Act 2012
    - FIDReC
  currency_codes: [SGD]
  currency_symbols: ["S$"]
  registration_numbers:
    # Unique Entity Number: business (8 digits + letter), local company (year + 5 digits +
    # letter) and other entities (T/S/R, year, entity type, 4 digits, letter).
    - '\b(?:\d{8}[A-Z]|(?:19|20)\d{7}[A-Z]|[TSR]\d{2}[A-Z]{2}\d{4}[A-Z])\b'
  postcodes:
    - '\bSingapore\s?\(?\d{6}\)?(?!\d)'
  phone_numbers:
    - '\+65[\s-]?[3689]\d{3}[\s-]?\d{4}\b'
