  title: Personal Data Protection Act 2012
  statement: >
    The collection, use and disclosure of personal data by organisations in Singapore is
    governed by the Personal Data Protection Act 2012.
  # The entries the cyber and data screen reads its figures from, each verified on its own.
  # The screen states the law only when every one of them is owner-facing, and otherwise
  # states none of it (cyber.regime): half a statement of the law is worse than none.
  values:
    statute: Personal Data Protection Act 2012
    short_title: PDPA
    label: Personal Data Protection Act 2012 (Singapore)
    regulator: SG-REG-PDPC
    regulator_short: PDPC
    penalty: SG-STAT-PDPA-PENALTY
    notification: SG-TL-PDPA-BREACH-NOTIFICATION
    significant_scale: SG-STAT-PDPA-SIGNIFICANT-SCALE
  verification:
    status: SOURCE_QUOTED
    source_url: "https://sso.agc.gov.sg/Act/PDPA2012"
    retrieved_on: 2026-10-10
    quote: An Act to govern the collection, use and disclosure of personal data by organisations
    verified_by: null
    note: The quote is the Act's long title.

