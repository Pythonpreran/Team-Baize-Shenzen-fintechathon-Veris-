# What Singapore commercial wordings conventionally say. Not law: a convention is labelled as
# one wherever it is used, and the customer's own wording governs.
market_conventions:
  - id: SG-MC-PREMIUM-PAYMENT-WARRANTY
    title: Premium payment warranty period
    statement: >
      The Singapore commercial wording the engine is measured against states a 60-day premium
      payment warranty: cover terminates automatically if the premium is not received within
      60 days of inception.
    values: {days: 60}
    verification:
      status: HUMAN_VERIFIED
      source_url: "https://www.dbs.com.sg/sme/pdf/oaos-selectpluslite-policywording.pdf"
      retrieved_on: 2026-10-09
      quote: is not paid and received in full by Chubb within 60 days of the inception of Policy Period
      verified_by: VERIS team (prior build's PREMIUM-PAYMENT-WARRANTY-TIMING rule, read against cl 3.20 of that wording)
      note: Quoted from the corpus copy of the published wording (corpus id sg-chubb-selectplus-wording).

