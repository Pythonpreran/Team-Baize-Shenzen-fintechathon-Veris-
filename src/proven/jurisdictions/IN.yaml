  values: {}
  verification: *candidate

advice_boundary:
  product_boundary: >
    VERIS states what your documents say and where they say it. It does not recommend a
    product, an insurer or a premium, and it never suggests that you buy, cancel, switch or
    surrender cover. For advice, speak to a licensed intermediary or to your insurer.
  regulatory_basis:
    id: IN-AB-INSURANCE-ADVICE
    title: Insurance advice boundary
    statement: A primary source is required before VERIS makes an India-specific statement about insurance advice regulation.
    values: {}
    verification: *candidate

detection:
  governing_law:
    - '\b(?:governed by|construed in accordance with|interpreted in accordance with|subject to)\b[^.;]{0,60}?\blaws? of India\b'
    - '\b(?:governed by|construed in accordance with|interpreted in accordance with|subject to)\b[^.;]{0,60}?\bIndian [Ll]aw\b'
  names:
    - Insurance Regulatory and Development Authority of India
    - IRDAI
    - Insurance Ombudsman
    - Bima Bharosa
    - Motor Vehicles Act, 1988
    - Insurance Act, 1938
  currency_codes: [INR]
  currency_symbols: ["₹", "Rs."]
  registration_numbers:
    # Product UINs start with the regulator marker and retain slash-delimited product parts.
    - '\bIRDAI/[A-Z]{2,5}/[A-Z0-9][A-Z0-9._-]*(?:/[A-Z0-9][A-Z0-9._-]*){2,}\b'
    # Corporate Identity Number, e.g. U66010MH2000PLC128403.
    - '\b[LU]\d{5}[A-Z]{2}\d{4}[A-Z]{3}\d{6}\b'
    # PAN, e.g. ABCDE1234F.
    - '\b[A-Z]{5}\d{4}[A-Z]\b'
  postcodes:
    - '\b(?:Mumbai|New Delhi|Delhi|Bengaluru|Bangalore|Chennai|Kolkata|Hyderabad|Pune|Ahmedabad|Gurugram|Noida)\s*[-,]?\s*\d{6}(?!\d)'
    - '\bPIN(?: Code)?\s*[:\-]?\s*\d{6}(?!\d)'
  phone_numbers:
    - '\+91[\s-]?\d'
