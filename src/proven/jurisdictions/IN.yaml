# VERIS jurisdiction pack — India.
#
# Every statement about law or regulation is either backed by a verbatim primary-source
# quote or retained as CANDIDATE evidence.  A CANDIDATE entry is intentionally absent from
# owner-facing output: it records exactly what still needs a primary source, rather than
# turning an incomplete research note into a legal statement.

code: IN
name: India
version: 1
summary: >
  India. Indian-number money formatting, Indian public holidays and document authorship;
  a quoted motor third-party insurance requirement; and a complaint-route evidence record
  that remains explicit about the timelines still awaiting primary-source verification.
locales: [en-IN]
timezone: Asia/Kolkata
holiday_calendar:
  provider: holidays
  country: IN
  wired: true
  note: The holidays provider is used for working-day arithmetic from this pack.

currency:
  code: INR
  symbol: "₹"
  local_symbol: "₹"
  minor_units: 2
  group_separator: ","
  decimal_separator: "."
  grouping: INDIAN

regulators:
  - id: IN-REG-IRDAI
    title: Insurance Regulatory and Development Authority of India
    statement: The regulator's insurance-role statement needs a primary-source quote before VERIS can show it to an owner.
    values: {short_name: IRDAI}
    verification:
      status: CANDIDATE
      source_url: null
      retrieved_on: null
      quote: null
      verified_by: null
      note: Record a regulator-authored role statement before upgrading this entry.

statutes:
  - id: IN-STAT-MVA-146
    title: Motor Vehicles Act, 1988, section 146
    statement: Section 146 requires the policy of insurance it describes before a motor vehicle is used in a public place.
    values: {section: "146", protection: MOTOR_THIRD_PARTY}
    verification:
      status: SOURCE_QUOTED
      source_url: "https://www.indiacode.nic.in/bitstream/123456789/9460/1/a1988-59.pdf"
      retrieved_on: 2026-10-11
      quote: a policy of insurance complying with the requirements of this Chapter
      verified_by: null
      note: The quoted India Code copy was fetched and checked on 2026-10-11.
  - id: IN-STAT-MVA-196
    title: Motor Vehicles Act, 1988, section 196
    statement: The current text of the section 196 penalty needs confirmation from a consolidated primary source before VERIS can state it to an owner.
    values: {section: "196"}
    verification:
      status: CANDIDATE
      source_url: "https://www.indiacode.nic.in/bitstream/123456789/9460/1/a1988-59.pdf"
      retrieved_on: 2026-10-11
      quote: null
      verified_by: null
      note: The fetched Act PDF is not relied on for the current penalty because the consolidated amended text was not verified.

compulsory_covers:
  - id: IN-COMP-MOTOR-THIRD-PARTY
    title: Motor third-party insurance
    statement: The Motor Vehicles Act section 146 entry is the sourced basis for the motor third-party insurance requirement.
    values: {protection: MOTOR_THIRD_PARTY, statute: IN-STAT-MVA-146}
    verification:
      status: SOURCE_QUOTED
      source_url: "https://www.indiacode.nic.in/bitstream/123456789/9460/1/a1988-59.pdf"
      retrieved_on: 2026-10-11
      quote: a policy of insurance complying with the requirements of this Chapter
      verified_by: null
      note: The section 196 penalty remains a separate CANDIDATE until its current text is verified.

